name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Build and package app
        run: ./scripts/package.sh
      - name: Verify media and persistence
        run: ./scripts/verify.sh
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: Lewtech-Record-macOS-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
